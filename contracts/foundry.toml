[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
test = "test"
script = "script"
solc = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
# Size over speed: Sepolia charges ~1,600 gas per deployed byte and caps a tx at 16,777,216 gas (EIP-7825).
cbor_metadata = false
bytecode_hash = "none"

[fuzz]
runs = 256

[fmt]
line_length = 120

[dependencies]
"@openzeppelin-contracts" = "5.1.0"
"@openzeppelin-contracts-upgradeable" = "5.1.0"
forge-std = "1.14.0"
"@openzeppelin-confidential-contracts" = { version = "0.5.3", git = "https://github.com/OpenZeppelin/openzeppelin-confidential-contracts.git", rev = "4a4f6c71f58b75e391899b57e42e3b73d288dfe3" }
"@encrypted-types" = "0.0.4"
"@fhevm-solidity" = "0.11.1"
forge-fhevm = { version = "eba2324", git = "https://github.com/zama-ai/forge-fhevm.git", rev = "eba232440117cf17e0f45be7a337b5dd64a50635" }

[soldeer]
remappings_version = false
recursive_deps = false

[lint]
# `reentrancy-events` fires on the FHE ACL/executor host calls (FHE.allow, FHE.select, ...), which are trusted
# system contracts, not reentrancy vectors. The one untrusted call (the token) runs under nonReentrant, after all
# state and events are written. `block-timestamp` is the intended invoice expiry check.
# `calls-loop` / `require-revert-in-loop`: PayLinksReader is a view-only pager over a bounded page, and the
# constructor validates its token list in a loop.
exclude_lints = ["reentrancy-events", "block-timestamp", "calls-loop", "require-revert-in-loop"]

# The cleartext FHEVM host stack for local demos (scripts/local-chain.sh) is built with forge-fhevm's own settings:
# the size-optimised via_ir build of the default profile does not deploy correctly on anvil.
[profile.host]
src = "src"
out = "out-host"
libs = ["dependencies"]
script = "script"
solc = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 100
via_ir = false
cbor_metadata = false
bytecode_hash = "none"
